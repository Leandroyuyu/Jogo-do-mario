<!DOCTYPE html><!-- Define que o documento é HTML5 -->
<html lang="en"><!-- Início do HTML e idioma da página -->
<head>
    <meta charset="UTF-8"><!-- Área de configurações -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeira atividade</title>
    <style>
        table {margin: auto;}
    </style>
</head>
<body>
<table border="0">
  <tr>
    
    <td width="150" height="150"><!-- Célula da imagem -->
      <img src="Logo.png" width="150" height="150"><!-- Imagem do logo -->
    </td>

    <td width="500" height="80" align="center"><!-- Célula do vídeo -->
      <video width="500" height="188" controls loop><!-- Vídeo com controles -->
        <source src="Link do Video.mp4" type="video/mp4"> <!-- Arquivo do vídeo -->
      </video>
    </td>
  </tr>
  <tr>
    
    <td width="80" height="400" align="center"><!-- Célula do link -->
      <a href="Link do Video.mp4">Abrir vídeo</a><!-- Link para o vídeo -->
    </td>
    
    <td width="500" height="400"></td><!-- Célula vazia -->
  </tr>
</table>

</body>
</html>
